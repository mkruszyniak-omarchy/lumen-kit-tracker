name: Build and verify Lumen KIT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware build and Mini package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned Arm compiler
        uses: actions/cache@v4
        with:
          path: agt/10.3
          key: kit-arm-none-eabi-10.3-2021.10-linux-x86_64
      - name: Install or verify pinned Arm compiler
        run: bash scripts/bootstrap-toolchain.sh
      - name: Compile Original, Plus and Mini
        run: |
          set -o pipefail
          make all NPROC=2 BUILD_TAG=808p03 2>&1 | tee build_output.log
      - name: Build Mini release package
        run: NPROC=2 bash scripts/build-kit-mini.sh
      - name: Check shipped firmware and packaging validator
        run: |
          sha256sum -c firmware/mini/SHA256SUMS
          python3 tools/drum-kit/test_package_release.py
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Summarize firmware memory use
        if: always()
        run: |
          {
            echo '## Lumen KIT — firmware build'
            echo 'Mini release assets are in the lumen-kit-mini artifact.'
            echo 'Original compilation does not include KIT; Plus still needs hardware testing.'
            echo '```text'
            grep -E 'Memory region|FLASH:|RAM:|QSPI_FLASH:|SRAM_DTC:|SRAM_ITC:|SRAM_OC:|EXTERNAL_RAM:' build_output.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Mini package
        uses: actions/upload-artifact@v4
        with:
          name: lumen-kit-mini
          path: dist/
          if-no-files-found: error

  dsp:
    name: KIT DSP and routing tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run SDK/DSP checks with ASan and UBSan
        run: bash tools/drum-kit/verify.sh
      - name: Check release packaging
        run: python3 tools/drum-kit/test_package_release.py
